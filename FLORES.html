<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="icon" href="./img/flowers.png" type="image/x-icon" />
    <title>Flower Animation</title>
    <style>
      .wish-message {
        position: absolute;
        top: 9%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        opacity: 0;
        animation: wish-fade 7s ease forwards;
        animation-delay: 0.6s;
      }
      @keyframes wish-fade {
        0%   { opacity: 0; }
        15%  { opacity: 1; }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }

      .wish-message__eyebrow {
        display: block;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        font-size: 0.62rem;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 0.55rem;
      }

      .wish-message__rule {
        width: 28px;
        height: 1px;
        background: rgba(255, 255, 255, 0.4);
        margin: 0.6rem auto 0.7rem;
      }

      .wish-message__main {
        display: block;
        font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(1.5rem, 4vw, 2.15rem);
        letter-spacing: 0.01em;
        line-height: 1.3;
        color: #fdfaf4;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      }

      .wish-message__emoji {
        display: inline-block;
        font-style: normal;
        margin-left: 0.15em;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
      }

      .hearts-field {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 18%;
        overflow: hidden;
        pointer-events: none;
        z-index: 9;
      }
      .hearts-field--left { left: 0; }
      .hearts-field--right { right: 0; }

      .heart {
        position: absolute;
        bottom: -30px;
        font-size: 1.1rem;
        opacity: 0;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
        animation: heart-float linear forwards;
      }

      @keyframes heart-float {
        0%   { opacity: 0; transform: translateY(0) translateX(0) scale(0.8); }
        12%  { opacity: 0.9; }
        80%  { opacity: 0.5; }
        100% { opacity: 0; transform: translateY(-70vh) translateX(var(--drift, 20px)) scale(1.1); }
      }
    </style>
  </head>

    <script src="./js/main.js"></script>
    <!-- <script src="./js/audio.js"></script> -->

    <script>
      (function () {
        var leftField = document.getElementById('heartsLeft');
        var rightField = document.getElementById('heartsRight');
        var symbols = ['💕', '💖', '💗', '♥'];

        function spawnHeart(field) {
          var heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          heart.style.left = Math.random() * 80 + '%';
          heart.style.fontSize = (0.85 + Math.random() * 0.9) + 'rem';
          heart.style.setProperty('--drift', (Math.random() * 40 - 20) + 'px');
          heart.style.animationDuration = (4.5 + Math.random() * 3) + 's';
          field.appendChild(heart);
          heart.addEventListener('animationend', function () {
            heart.remove();
          });
        }

        setInterval(function () {
          spawnHeart(leftField);
        }, 900);

        setInterval(function () {
          spawnHeart(rightField);
        }, 1100);
      })();
    </script>
